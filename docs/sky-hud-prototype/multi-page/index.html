<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Route / — Tổng quan &amp; Điều khiển | AgentLeash Multi-Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../hud-tokens.css">
  <link rel="stylesheet" href="./mp-shell.css">
</head>
<body>
  <div id="mp-root"></div>

  <script src="../hud-sim.js"></script>
  <script src="./mp-shell.js"></script>
  <script>
    window.AgentLeashMultiPage.mountMultiPageApp("overview", function (mount, sim, s, d, H) {
      const r = 50;
      const c = 2 * Math.PI * r;
      const pct = Math.max(0, Math.min(1, d.spendableRatio));
      const dashOffset = c * (1 - pct);
      const wlRemainPct = Math.round((d.remainingDaily / s.dailyCapUnits) * 100);
      const sbRemainPct = Math.round((d.remainingSandbox / s.sandboxDailyCapUnits) * 100);

      const steps = [
        { n: 1, label: "Đăng nhập", done: s.authenticated },
        { n: 2, label: "Luật 2 tầng", done: s.authenticated },
        { n: 3, label: "Mua x402", done: d.hasSpends },
        { n: 4, label: "Chặn trần", done: d.hasWhitelistCapBlock },
        { n: 5, label: "Sandbox", done: d.hasSandboxBlock },
        { n: 6, label: "Kill Switch", done: s.paused },
        { n: 7, label: "Snowscan", done: d.hasSpends && s.paused },
      ];

      mount.innerHTML = `
        <section class="al-glass-panel mp-page-banner">
          <div>
            <h1 class="al-hero-greeting">Buồng lái Tổng quan (Route <code class="mono" style="color:var(--flow-text);">/</code>)</h1>
            <p style="font-size:0.8125rem;color:var(--sky-muted);margin-block-start:0.2rem;">
              Trang chủ chỉ giữ trạng thái sức khỏe ví, đồng hồ 2 tầng và bảng điều khiển nhanh. Dữ liệu chuyên sâu nằm ở các trang bên trái.
            </p>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
            <a href="./flows.html" class="al-btn">Mở Dòng tiền x402 →</a>
            <a href="./policies.html" class="al-btn al-btn--promote">Cấu hình Luật 2 tầng →</a>
          </div>
        </section>

        <!-- Thanh Demo 7 bước -->
        <section class="al-glass-panel mp-card ${s.bypassRules ? "al-glass-panel--danger" : "al-glass-panel--sandbox"}" aria-label="Bảng điều khiển Demo nhanh">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.75rem;">
            <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;">
              <span class="al-chip ${s.bypassRules ? "al-chip--danger" : "al-chip--sandbox"}">${H.ICONS.terminal} Demo 7 bước</span>
              <strong>${s.bypassRules ? "Đang giả lập agent bị chiếm quyền (--bypass-rules)" : "Kịch bản Đà Lạt (--mock-llm) trên Fuji"}</strong>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
              <button type="button" id="ov-probe" class="al-btn">Thử gọi API lạ (0.0005)</button>
              <button type="button" id="ov-demo" ${s.runningDemo ? "disabled" : ""} class="al-gradient-pill ${s.bypassRules ? "al-gradient-pill--danger" : ""}" style="min-block-size:2.5rem;padding:0.35rem 1.1rem;">
                ${s.bypassRules ? H.ICONS.alert : H.ICONS.play}
                <span>${s.runningDemo ? "Đang chạy…" : s.bypassRules ? "Thử tấn công địa chỉ lạ" : "Chạy Agent Đà Lạt"}</span>
              </button>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:0.45rem;">
            ${steps
              .map(
                (st) => `
              <div class="al-inset-well" style="padding:0.45rem 0.6rem;display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;border-color:${st.done ? "rgba(34,197,94,0.4)" : "rgba(122,222,255,0.12)"};color:${st.done ? "var(--trusted-text)" : "var(--sky-muted)"};">
                <span class="mono">${st.done ? H.ICONS.check : st.n + "."}</span>
                <span>${st.label}</span>
              </div>`,
              )
              .join("")}
          </div>
        </section>

        <div class="mp-grid-2">
          <!-- Left: Guardrail Readiness -->
          <section class="al-glass-panel mp-card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;">
              <h2 class="al-panel-title">Hạn mức 2 tầng &amp; Sức khỏe ví</h2>
              <span class="al-chip ${s.paused ? "al-chip--danger" : "al-chip--trusted"}">${s.paused ? "Đã khóa (paused)" : "Đang hoạt động"}</span>
            </div>

            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem;">
              <div style="position:relative;inline-size:126px;block-size:126px;display:grid;place-items:center;margin-inline:auto;">
                <svg viewBox="0 0 124 124" width="126" height="126" aria-hidden="true">
                  <circle cx="62" cy="62" r="${r}" fill="none" stroke="rgba(122,222,255,0.12)" stroke-width="8"/>
                  <circle cx="62" cy="62" r="${r}" fill="none" stroke="${s.paused ? "#ef4444" : "#5eead4"}" stroke-width="8" stroke-linecap="round"
                    stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}" transform="rotate(-90 62 62)"/>
                </svg>
                <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
                  <span style="font-size:0.7rem;color:var(--sky-muted);">Chi được ngay</span>
                  <strong class="mono tabular-nums" style="font-size:1.05rem;color:${s.paused ? "var(--danger-text)" : "var(--flow-text)"};">${H.formatUsdc(d.spendableNow)}</strong>
                  <span class="mono" style="font-size:0.7rem;color:var(--sky-muted);">/ ${H.formatUsdc(s.dailyCapUnits)} USDC</span>
                </div>
              </div>

              <div class="mp-grid-3" style="flex:1;min-inline-size:210px;">
                <div class="al-inset-well" style="padding:0.7rem 0.85rem;">
                  <div style="font-size:0.75rem;color:var(--sky-muted);">Số dư Policy</div>
                  <strong class="mono tabular-nums" style="font-size:1.05rem;">${H.formatUsdc(s.balanceUnits)} USDC</strong>
                </div>
                <div class="al-inset-well" style="padding:0.7rem 0.85rem;">
                  <div style="font-size:0.75rem;color:var(--sky-muted);">Hồi hạn mức sau</div>
                  <strong data-mp-countdown class="mono tabular-nums" style="font-size:1.05rem;">${H.formatCountdown(s.secondsToReset)}</strong>
                </div>
                <div class="al-inset-well" style="padding:0.7rem 0.85rem;">
                  <div style="font-size:0.75rem;color:var(--sky-muted);">ERC-8004</div>
                  <strong class="mono" style="font-size:1.05rem;color:var(--trusted-text);">ID #305</strong>
                </div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:0.75rem;">
              <div>
                <div style="display:flex;justify-content:space-between;font-size:0.8125rem;margin-block-end:0.25rem;">
                  <span>Tầng 1 · Whitelist (tin cậy)</span>
                  <span class="mono tabular-nums" style="color:var(--trusted-text);">${H.formatUsdc(d.remainingDaily)} / ${H.formatUsdc(s.dailyCapUnits)} USDC</span>
                </div>
                <div class="al-meter-track"><div class="al-meter-fill al-meter-fill--trusted" style="inline-size:${wlRemainPct}%;"></div></div>
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;font-size:0.8125rem;margin-block-end:0.25rem;">
                  <span>Tầng 2 · Sandbox (API lạ)</span>
                  <span class="mono tabular-nums" style="color:var(--sandbox-text);">${H.formatUsdc(d.remainingSandbox)} / ${H.formatUsdc(s.sandboxDailyCapUnits)} USDC</span>
                </div>
                <div class="al-meter-track"><div class="al-meter-fill al-meter-fill--sandbox" style="inline-size:${sbRemainPct}%;"></div></div>
              </div>
            </div>
          </section>

          <!-- Right: Live Snapshot (Links to /flows & /audit) -->
          <section class="al-glass-panel mp-card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;">
              <h2 class="al-panel-title">Hoạt động mới nhất</h2>
              <span class="mono tabular-nums" data-mp-updated style="font-size:0.75rem;color:var(--sky-muted);">${s.updatedAt}</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:0.65rem;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="al-hud-heading">Khoản chi gần đây</span>
                <a href="./flows.html" style="font-size:0.75rem;color:var(--flow);text-decoration:none;">Xem tất cả (${s.spends.length}) →</a>
              </div>
              <ul class="al-list">
                ${s.spends
                  .slice(0, 2)
                  .map((sp) => {
                    const nowWl = s.whitelist[sp.payTo.toLowerCase()] === true;
                    return `
                    <li style="padding-block:0.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;">
                      <div>
                        <div style="display:flex;align-items:center;gap:0.4rem;">
                          <strong style="font-size:0.8125rem;">${sp.name}</strong>
                          <span class="al-chip ${sp.isSandbox ? "al-chip--sandbox" : "al-chip--trusted"}">${sp.isSandbox ? "Sandbox" : "Whitelist"}</span>
                        </div>
                        <div class="mono" style="font-size:0.75rem;color:var(--sky-muted);">${sp.time} · ${H.shortAddr(sp.payTo)}</div>
                      </div>
                      <div style="display:flex;align-items:center;gap:0.5rem;">
                        ${
                          sp.isSandbox && !nowWl
                            ? `<button type="button" class="al-btn al-btn--promote" data-ov-promote="${sp.payTo}" ${!s.authenticated ? "disabled" : ""} style="min-block-size:1.85rem;padding:0.2rem 0.55rem;font-size:0.75rem;">Chuyển thành API quen</button>`
                            : ""
                        }
                        <strong class="mono tabular-nums" style="color:var(--flow-text);">−${H.formatUsdc(sp.amountUnits)} USDC</strong>
                      </div>
                    </li>`;
                  })
                  .join("")}
              </ul>
            </div>

            <div style="display:flex;flex-direction:column;gap:0.65rem;padding-block-start:0.5rem;border-block-start:1px solid var(--divider-hairline);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="al-hud-heading" style="color:var(--danger-text);">Lần bị chặn gần nhất</span>
                <a href="./audit.html" style="font-size:0.75rem;color:var(--flow);text-decoration:none;">Xem nhật ký (${s.rejections.length}) →</a>
              </div>
              <ul class="al-list">
                ${s.rejections
                  .slice(0, 2)
                  .map(
                    (rj) => `
                  <li style="padding-block:0.5rem;display:flex;flex-direction:column;gap:0.2rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:0.4rem;">
                      <span class="al-chip ${rj.source === "contract" ? "al-chip--danger" : "al-chip--sandbox"}">${rj.code}</span>
                      <span class="mono tabular-nums" style="font-size:0.75rem;color:var(--sky-muted);">${rj.time}</span>
                    </div>
                    <strong style="font-size:0.8125rem;">${rj.title}</strong>
                  </li>`,
                  )
                  .join("")}
              </ul>
            </div>
          </section>
        </div>
      `;

      document.getElementById("ov-demo").addEventListener("click", sim.runDemoSequence);
      document.getElementById("ov-probe").addEventListener("click", sim.runSandboxProbe);
      mount.querySelectorAll("[data-ov-promote]").forEach((btn) =>
        btn.addEventListener("click", () => sim.toggleWhitelist(btn.dataset.ovPromote, true)),
      );
    });
  </script>
</body>
</html>
